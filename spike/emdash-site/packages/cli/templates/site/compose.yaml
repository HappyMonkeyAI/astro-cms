# astro-cms site, generated by `astro-cms new`. Settings and secrets are in .env (never commit it).
#
#   docker compose up -d                    site on http://127.0.0.1:${SITE_PORT}, for a VPN or your own proxy
#   docker compose --profile tls up -d      plus Caddy with automatic HTTPS for ${DOMAIN}
#
# The setup wizard is locked until opened with the setup link (see README.md).
name: ${SITE_NAME}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cms
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  site:
    image: ${ASTRO_CMS_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD}@db:5432/cms
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    # Loopback only: reach it through Caddy (--profile tls), a VPN, or your own reverse proxy
    ports:
      - "127.0.0.1:${SITE_PORT}:4321"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/_emdash/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    depends_on:
      - site
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
