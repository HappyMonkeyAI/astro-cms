services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: emdash
      POSTGRES_PASSWORD: emdash-spike
      POSTGRES_DB: emdash
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emdash"]
      interval: 2s
      retries: 30

  # Local mail catcher: SMTP on mailpit:1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"

  emdash:
    build:
      context: .
      args:
        DATABASE_URL: postgres://emdash:emdash-spike@db:5432/emdash
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://emdash:emdash-spike@db:5432/emdash
      EMDASH_SITE_URL: http://localhost:4321
      UPLOADS_DIR: /app/data/uploads
      SMTP_URL: smtp://mailpit:1025
      # Runtime-only dummy OAuth credentials: tests whether they're read at runtime or baked at build
      EMDASH_OAUTH_MICROSOFT_CLIENT_ID: 00000000-0000-0000-0000-00000000d00d
      EMDASH_OAUTH_MICROSOFT_CLIENT_SECRET: runtime-dummy-ms-secret
      EMDASH_OAUTH_MICROSOFT_TENANT_ID: 11111111-1111-1111-1111-111111111111
    ports:
      - "4321:4321"
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  pg-data:
  uploads:
